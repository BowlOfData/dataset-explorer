name: text-editor build

on:
  push:
    branches: [main]
    paths:
      - "text-editor/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "text-editor/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            output: text-editor-linux
          - os: windows-latest
            output: text-editor-windows.exe
          - os: macos-latest
            output: text-editor-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Linux GL/X11 dev headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev pkg-config

      - name: Build
        working-directory: text-editor
        run: go build -o ../dist/${{ matrix.output }} .

      - name: Vet
        working-directory: text-editor
        run: go vet ./...

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        working-directory: text-editor
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
